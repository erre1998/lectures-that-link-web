<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lectures that Link</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Lectures that Link</h1>
      <p id="dataset-version">Dataset: v0.8</p>
    </header>
    
    <main id="main-content">
      <section aria-labelledby="overview-heading">
        <h2 id="overview-heading">Overview</h2>
        
        <p id="status" role="status">Loading data…</p>
        
        <dl class="statistics">
          <div>
            <dt>Lecture series</dt>
            <dd id="count-series">–</dd>
          </div>
          <div>
            <dt>Terms</dt>
            <dd id="count-terms">–</dd>
          </div>
          <div>
            <dt>Lectures</dt>
            <dd id="count-lectures">–</dd>
          </div>
        </dl>
      </section>
    </main>
  </body>
</html>
