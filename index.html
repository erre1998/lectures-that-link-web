<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lectures that Link</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  
  <body>
    <header>
      <h1>Lectures that Link</h1>
      <p id="dataset-version">Dataset: v0.8</p>
    </header>
    
    <main id="main-content">
      
      <!-- Overview -->
      
      <section aria-labelledby="overview-heading">
        <h2 id="overview-heading">Overview</h2>
        
        <p id="status" role="status">Loading data…</p>
        
        <dl class="statistics">
          <div>
            <dt>Lecture series</dt>
            <dd id="count-series">–</dd>
          </div>
          
          <div>
            <dt>Terms</dt>
            <dd id="count-terms">–</dd>
          </div>
          
          <div>
            <dt>Lectures</dt>
            <dd id="count-lectures">–</dd>
          </div>
        </dl>
      </section>
      
      
      <!-- Annual lecture statistics -->
      
      <section aria-labelledby="year-heading">
        <h2 id="year-heading">Lectures per year</h2>
        
        <div class="table-container"
          role="region"
          aria-labelledby="year-heading"
          tabindex="0">
          
          <table>
            <caption>Annual lecture records by format</caption>
            
            <thead>
              <tr>
                <th scope="col">Year</th>
                <th scope="col">In person</th>
                <th scope="col">Online</th>
                <th scope="col">Canceled</th>
                <th scope="col">Other or unknown</th>
                <th scope="col">Multiple formats</th>
                <th scope="col">Total</th>
              </tr>
            </thead>
            
            <tbody id="lectures-per-year"></tbody>
          </table>
          
        </div>
        
        <p class="analysis-note">
          Totals include canceled lectures.
          Format categories may overlap.
        </p>
        
        <p id="undated-lectures"></p>
      </section>
      
    </main>
  </body>
</html>
